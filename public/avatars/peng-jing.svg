<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <defs>
    <radialGradient id="bgGrad-peng-jing" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#6e1212"/>
    </radialGradient>
    <filter id="shadow-peng-jing" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="320" fill="url(#bgGrad-peng-jing)"/>

  <g opacity="0.04" stroke="#ffffff" stroke-width="1" fill="none">
    <circle cx="120" cy="140" r="80"/>
    <circle cx="120" cy="140" r="100"/>
    <circle cx="120" cy="140" r="120"/>
  </g>

  <!-- Silhouette / Figure -->
  <g filter="url(#shadow-peng-jing)">
    <!-- Shoulders / Blazer -->
    <path d="M 16 320 C 20 268, 48 235, 78 222 L 100 230 L 120 255 L 140 230 L 162 222 C 192 235, 220 268, 224 320 Z" fill="#1e293b"/>
    
    <!-- Elegant White/Cream Blouse -->
    <polygon points="98,228 120,250 142,228 132,188 108,188" fill="#f8fafc"/>
    <ellipse cx="120" cy="225" rx="8" ry="12" fill="#f1f5f9"/>

    <!-- Blazer Lapels -->
    <polygon points="78,222 100,230 120,285 110,320 65,320" fill="#0f172a"/>
    <polygon points="162,222 140,230 120,285 130,320 175,320" fill="#0f172a"/>

    <!-- Neck -->
    <rect x="108" y="168" width="24" height="32" rx="3" fill="#f3cbaf"/>
    <ellipse cx="120" cy="190" rx="12" ry="5" fill="#e7b594" opacity="0.4"/>

    <!-- Head & Face (Slightly softer chin) -->
    <ellipse cx="120" cy="138" rx="42" ry="50" fill="#f7d3bb"/>
    
    <!-- Ears -->
    <ellipse cx="76" cy="140" rx="5" ry="10" fill="#f0c2a2"/>
    <ellipse cx="164" cy="140" rx="5" ry="10" fill="#f0c2a2"/>

    <!-- Hair (Professional Medium Short/Bobs) -->
    <path d="M 70 145 C 68 85, 92 72, 120 72 C 148 72, 172 85, 170 145 C 174 165, 168 185, 162 195 C 158 170, 162 130, 158 105 C 148 88, 134 84, 120 84 C 106 84, 92 88, 82 105 C 78 130, 82 170, 78 195 C 72 185, 66 165, 70 145 Z" fill="#1e1e24"/>

    <!-- Eyebrows (Curved) -->
    <path d="M 92 119 Q 102 115 109 119" stroke="#33241d" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M 148 119 Q 138 115 131 119" stroke="#33241d" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Bright, Dignified) -->
    <ellipse cx="101" cy="128" rx="5" ry="3.2" fill="#2d221e"/>
    <ellipse cx="139" cy="128" rx="5" ry="3.2" fill="#2d221e"/>
    <circle cx="102" cy="127" r="1" fill="#ffffff"/>
    <circle cx="140" cy="127" r="1" fill="#ffffff"/>

    <!-- Nose -->
    <path d="M 120 126 L 119 145 L 123 145" stroke="#d59c7d" stroke-width="1.3" stroke-linecap="round" fill="none"/>

    <!-- Gentle Formal Lip -->
    <path d="M 110 162 Q 120 167 130 162" stroke="#be5d5d" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ID Bar -->
  <g opacity="0.88">
    <rect x="0" y="282" width="240" height="38" fill="#000000" fill-opacity="0.65"/>
    <text x="120" y="298" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
      彭晶 · 证件标准像
    </text>
    <text x="120" y="312" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">
      中国证监会干部人事档案 · 副厅局级
    </text>
  </g>

  <rect x="1.5" y="1.5" width="237" height="317" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="3"/>
</svg>