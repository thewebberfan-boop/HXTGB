<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <defs>
    <!-- Background Gradient (Standard Red ID Backdrop) -->
    <radialGradient id="bgGrad-yao-qian" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#6e1212"/>
    </radialGradient>
    
    <!-- Face Shadow -->
    <filter id="shadow-yao-qian" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="240" height="320" fill="url(#bgGrad-yao-qian)"/>

  <!-- Subtle Guilloche / Security Pattern lines in background -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1" fill="none">
    <circle cx="120" cy="140" r="80"/>
    <circle cx="120" cy="140" r="100"/>
    <circle cx="120" cy="140" r="120"/>
    <circle cx="120" cy="140" r="140"/>
  </g>

  <!-- Silhouette / Figure -->
  <g filter="url(#shadow-yao-qian)">
    <!-- Suit Shoulders & Body -->
    <path d="M 12 320 C 14 265, 45 232, 78 220 L 98 226 L 120 255 L 142 226 L 162 220 C 195 232, 226 265, 228 320 Z" fill="#1e293b"/>
    
    <!-- White Shirt Collar -->
    <polygon points="98,226 120,250 142,226 132,192 108,192" fill="#ffffff"/>
    <polygon points="102,196 112,230 120,214 106,194" fill="#f1f5f9"/>
    <polygon points="138,196 128,230 120,214 134,194" fill="#e2e8f0"/>

    <!-- Tie -->
    <polygon points="115,224 125,224 128,320 112,320" fill="#991b1b"/>
    <!-- Tie Stripes -->
    <line x1="113" y1="240" x2="126" y2="248" stroke="#f59e0b" stroke-width="2.5" opacity="0.8"/>
    <line x1="113" y1="265" x2="127" y2="273" stroke="#f59e0b" stroke-width="2.5" opacity="0.8"/>
    <line x1="112" y1="290" x2="128" y2="298" stroke="#f59e0b" stroke-width="2.5" opacity="0.8"/>
    
    <!-- Suit Lapels (Dark Navy Formal) -->
    <polygon points="78,220 98,226 120,275 110,320 65,320" fill="#0f172a"/>
    <polygon points="162,220 142,226 120,275 130,320 175,320" fill="#0f172a"/>

    <!-- Neck -->
    <rect x="106" y="172" width="28" height="30" rx="3" fill="#e7b99a"/>
    <ellipse cx="120" cy="192" rx="14" ry="6" fill="#d99b75" opacity="0.4"/>

    <!-- Head & Face -->
    <ellipse cx="120" cy="138" rx="44" ry="52" fill="#f0c7ab"/>
    
    <!-- Ears -->
    <ellipse cx="74" cy="140" rx="6" ry="11" fill="#e7b594"/>
    <ellipse cx="166" cy="140" rx="6" ry="11" fill="#e7b594"/>

    <!-- Neatly Groomed Hair (Formal Cadre Style) -->
    <path d="M 72 135 C 70 95, 90 74, 120 74 C 150 74, 170 95, 168 135 C 160 102, 142 90, 120 90 C 98 90, 80 102, 72 135 Z" fill="#1e1e24"/>
    <path d="M 73 130 C 76 96, 96 82, 124 82 C 146 82, 162 92, 167 118 C 162 108, 146 100, 124 100 C 98 100, 82 110, 73 130 Z" fill="#2d2d34"/>

    <!-- Eyebrows -->
    <path d="M 90 120 Q 102 117 109 121" stroke="#2b2623" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M 150 120 Q 138 117 131 121" stroke="#2b2623" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Eyes (Gentle, Serious) -->
    <ellipse cx="100" cy="129" rx="5" ry="3" fill="#2d221e"/>
    <ellipse cx="140" cy="129" rx="5" ry="3" fill="#2d221e"/>
    <circle cx="101" cy="128" r="1" fill="#ffffff"/>
    <circle cx="141" cy="128" r="1" fill="#ffffff"/>

    <!-- Glasses Frame (Scholarly cadre look) -->
    <rect x="88" y="122" width="22" height="14" rx="3" fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.6"/>
    <rect x="130" y="122" width="22" height="14" rx="3" fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.6"/>
    <line x1="110" y1="128" x2="130" y2="128" stroke="#64748b" stroke-width="1.5" opacity="0.6"/>

    <!-- Nose -->
    <path d="M 120 128 L 118 147 L 123 147" stroke="#cb8f6c" stroke-width="1.5" stroke-linecap="round" fill="none"/>

    <!-- Gentle Formal Smile -->
    <path d="M 108 162 Q 120 168 132 162" stroke="#a25b42" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Security / ID Photo Stamp Watermark in bottom right -->
  <g opacity="0.88">
    <!-- Bottom Semi-transparent ID Bar -->
    <rect x="0" y="282" width="240" height="38" fill="#000000" fill-opacity="0.65"/>
    <text x="120" y="298" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
      姚前 · 证件标准像
    </text>
    <text x="120" y="312" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">
      中国证监会干部人事档案 · 正厅局级
    </text>
  </g>

  <!-- Photo Border Frame (2-inch standard photo look) -->
  <rect x="1.5" y="1.5" width="237" height="317" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="3"/>
</svg>